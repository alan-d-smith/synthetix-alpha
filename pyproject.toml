[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetix-alpha"
version = "0.1.0"
description = "Agent-designed, deterministically-executed options trading on Alpaca."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
    # Installed from the git submodule: `pip install -e external/gs-quant`
    "gs_quant",
    "httpx>=0.28",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["synthetix_alpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
