[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetix-alpha"
version = "0.1.0"
description = "Agent-designed, deterministically-executed options trading on Alpaca."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
    # Installed from the git submodule: `pip install -e external/gs-quant`
    "gs_quant",
    "alpaca-py>=0.44",
    "kagglehub>=0.3",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "yfinance>=1.0",
    "pyyaml>=6.0",
    "finnhub-python>=2.4",
    "openai>=1.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["synthetix_alpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
